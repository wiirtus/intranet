<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alza Dropshipment – Shipping Cookbook</title>
<script>
  // Set theme before first paint (no flash)
  (function () {
    var saved = localStorage.getItem('cookbook-theme');
    var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || sys);
  })();
</script>
<style>
  :root {
    --navy: #0F1B42;
    --navy-2: #1d2f6f;
    --yellow: #FFC800;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
    --radius: 14px;
  }
  [data-theme="light"] {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-2: #f1f4fa;
    --text: #1b2340;
    --muted: #5b6480;
    --border: #e1e6f0;
    --accent: #2f5bea;
    --accent-soft: #e8eeff;
    --heading: #0F1B42;
    --code-bg: #f6f8fc;
    --inline-code-bg: #eef1f8;
    --shadow: 0 1px 2px rgba(15,27,66,.06), 0 8px 24px rgba(15,27,66,.06);
    --green: #0f8a4a; --green-bg: #e3f6ec;
    --amber: #a86a00; --amber-bg: #fff3d0;
    --red: #c23535;   --red-bg: #fde8e8;
    --grey: #6b7390;  --grey-bg: #eef0f5;
    --blue: #2f5bea;  --blue-bg: #e8eeff;
    --hl-tag: #0F1B42; --hl-attr: #9a3fb8; --hl-string: #0f8a4a; --hl-number: #c25a00; --hl-literal: #2f5bea; --hl-punct: #7a83a0;
  }
  [data-theme="dark"] {
    --bg: #0a0f1f;
    --surface: #111833;
    --surface-2: #172042;
    --text: #e4e8f6;
    --muted: #97a1c2;
    --border: #253058;
    --accent: #7ea2ff;
    --accent-soft: #1b2a57;
    --heading: #ffffff;
    --code-bg: #0d1430;
    --inline-code-bg: #1d2850;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --green: #4fd68f; --green-bg: #12352a;
    --amber: #ffcf5a; --amber-bg: #3a2f0e;
    --red: #ff8a8a;   --red-bg: #3d1a22;
    --grey: #a3abc8;  --grey-bg: #222b4d;
    --blue: #7ea2ff;  --blue-bg: #1b2a57;
    --hl-tag: #ffd966; --hl-attr: #d6a2ff; --hl-string: #6fe0a2; --hl-number: #ffad66; --hl-literal: #8fb0ff; --hl-punct: #8590b5;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15.5px/1.65 var(--font);
    transition: background .25s, color .25s;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 12px;
    height: 56px; padding: 0 20px;
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--heading); }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--navy) 0 50%, var(--yellow) 50% 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .topbar .spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 12px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: 600 13px var(--font); cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn svg { width: 16px; height: 16px; }
  #menuBtn { display: none; }

  /* ---------- Layout ---------- */
  .layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); max-width: 1440px; margin: 0 auto; }
  nav.toc {
    position: sticky; top: 56px; align-self: start;
    height: calc(100vh - 56px); overflow-y: auto;
    padding: 24px 14px 40px 20px; border-right: 1px solid var(--border);
  }
  .toc h4 { margin: 0 0 10px 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc a {
    display: flex; gap: 8px; align-items: baseline;
    padding: 6px 10px; border-radius: 8px; color: var(--muted); font-size: 13.5px; line-height: 1.35;
  }
  .toc a:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
  .toc a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .toc .n { min-width: 20px; font-variant-numeric: tabular-nums; font-weight: 700; opacity: .8; }
  .toc ol ol a { padding-left: 38px; font-size: 12.5px; }
  .toc ol ol { display: none; }
  .toc li.open > ol { display: block; }

  main { padding: 28px 40px 80px; min-width: 0; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden;
    padding: 40px 40px 34px; margin-bottom: 28px; border-radius: 20px;
    background:
      radial-gradient(circle at 92% 10%, rgba(255,200,0,.35), transparent 38%),
      linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff; box-shadow: var(--shadow);
  }
  .hero::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
    background: linear-gradient(90deg, var(--yellow), #ffe27a, var(--yellow));
  }
  .hero .kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--yellow); }
  .hero h1 { margin: 8px 0 10px; font-size: clamp(28px, 4vw, 42px); line-height: 1.15; }
  .hero .subtitle { max-width: 820px; margin: 0 0 22px; color: #d5dcf2; font-size: 16.5px; }
  .hero .subtitle em { font-style: normal; }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .chip {
    padding: 10px 14px; border-radius: 12px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    font-size: 13.5px; color: #e8ecfa;
  }
  .chip b { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--yellow); margin-bottom: 2px; }
  .chip a { color: #fff; text-decoration: underline; text-decoration-color: rgba(255,255,255,.4); }
  .chip code { background: rgba(255,255,255,.12); color: #fff; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; font-size: 12.5px; color: #cfd6ef; align-items: center; }

  /* ---------- Section cards ---------- */
  section.card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 34px 26px; margin-bottom: 24px; box-shadow: var(--shadow);
  }
  h2, h3, h4 { color: var(--heading); scroll-margin-top: 76px; line-height: 1.3; }
  h2 { display: flex; align-items: center; gap: 14px; font-size: 24px; margin: 22px 0 14px; }
  h2 .num {
    flex: none; display: grid; place-items: center;
    width: 38px; height: 38px; border-radius: 11px;
    background: var(--yellow); color: var(--navy); font-size: 17px; font-weight: 800;
  }
  h3 { font-size: 18px; margin: 30px 0 10px; padding-left: 12px; border-left: 4px solid var(--yellow); }
  h4 { font-size: 15px; margin: 22px 0 8px; }
  p, li { color: var(--text); }
  strong { color: var(--heading); }
  hr { display: none; }

  code {
    font-family: var(--mono); font-size: .86em;
    background: var(--inline-code-bg); padding: .12em .4em; border-radius: 6px;
  }

  /* ---------- Tables ---------- */
  .table-wrap { overflow-x: auto; margin: 14px 0 18px; border: 1px solid var(--border); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    position: sticky; top: 0; text-align: left; font-weight: 700; font-size: 12.5px;
    letter-spacing: .03em; color: var(--heading);
    background: var(--surface-2); padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  td { padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td:last-child { min-width: 260px; }
  td.tight, th.tight { width: 1%; }
  td.tight { white-space: nowrap; }
  th.tight { min-width: 90px; }
  td code { white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
  tbody tr:hover td { background: var(--accent-soft); }

  .pill {
    display: inline-block; min-width: 26px; padding: 1px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 700; text-align: center; white-space: nowrap;
  }
  .pill.green { color: var(--green); background: var(--green-bg); }
  .pill.amber { color: var(--amber); background: var(--amber-bg); }
  .pill.red   { color: var(--red);   background: var(--red-bg); }
  .pill.grey  { color: var(--grey);  background: var(--grey-bg); }
  .pill.blue  { color: var(--blue);  background: var(--blue-bg); }

  .dir {
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    padding: 2px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700;
  }
  .dir .a { background: var(--navy); color: #fff; padding: 0 6px; border-radius: 4px; }
  .dir .s { background: var(--yellow); color: var(--navy); padding: 0 6px; border-radius: 4px; }
  [data-theme="dark"] .dir .a { background: #2b3d80; }

  /* ---------- Callouts ---------- */
  blockquote {
    margin: 16px 0; padding: 12px 16px 12px 48px; position: relative;
    border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2);
  }
  blockquote p { margin: 4px 0; }
  blockquote::before {
    position: absolute; left: 14px; top: 12px; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 800; font-size: 13px;
  }
  blockquote.note { border-color: color-mix(in srgb, var(--blue) 35%, transparent); background: var(--blue-bg); }
  blockquote.note::before { content: "i"; background: var(--blue); color: var(--surface); font-family: Georgia, serif; }
  blockquote.todo { border-color: color-mix(in srgb, var(--amber) 45%, transparent); background: var(--amber-bg); }
  blockquote.todo::before { content: "!"; background: var(--yellow); color: var(--navy); }
  blockquote.todo strong:first-child { color: var(--amber); }

  /* ---------- Code ---------- */
  .code-wrap { position: relative; margin: 14px 0 18px; }
  .code-wrap .lang {
    position: absolute; top: 8px; left: 14px; font: 700 10.5px var(--font);
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  .code-wrap .copy {
    position: absolute; top: 6px; right: 8px; height: 26px; padding: 0 10px;
    border-radius: 7px; border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); font: 600 11.5px var(--font); cursor: pointer; opacity: 0; transition: opacity .15s;
  }
  .code-wrap:hover .copy { opacity: 1; }
  .code-wrap .copy.done { color: var(--green); border-color: var(--green); }
  pre {
    margin: 0; padding: 32px 18px 16px; overflow-x: auto;
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px;
    font: 13px/1.6 var(--mono);
  }
  pre code { background: none; padding: 0; font-size: inherit; }
  .hljs-tag, .hljs-name { color: var(--hl-tag); }
  .hljs-attr { color: var(--hl-attr); }
  .hljs-string { color: var(--hl-string); }
  .hljs-number { color: var(--hl-number); }
  .hljs-literal, .hljs-keyword { color: var(--hl-literal); font-weight: 600; }
  .hljs-punctuation { color: var(--hl-punct); }

  /* ---------- Diagrams ---------- */
  figure.diagram {
    position: relative; margin: 18px 0 22px; padding: 22px 16px 14px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
    text-align: center; overflow-x: auto; cursor: zoom-in;
  }
  figure.diagram pre.mermaid { background: none; border: 0; padding: 0; font-family: var(--font); color: transparent; }
  figure.diagram svg { max-width: 100%; height: auto; }
  figure.diagram .zoom {
    position: absolute; top: 8px; right: 10px; font: 600 11px var(--font); color: var(--muted);
    opacity: 0; transition: opacity .15s;
  }
  figure.diagram:hover .zoom { opacity: 1; }
  .modal {
    position: fixed; inset: 0; z-index: 100; display: none; place-items: center;
    background: rgba(5,9,22,.75); backdrop-filter: blur(4px); cursor: zoom-out; padding: 3vh 3vw;
  }
  .modal.open { display: grid; }
  .modal .inner {
    width: 100%; max-height: 94vh; overflow: auto; padding: 24px;
    background: var(--surface); border-radius: 16px; box-shadow: var(--shadow);
  }
  .modal svg { width: 100% !important; max-width: none !important; height: auto; }

  img { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); }

  footer { margin-top: 30px; color: var(--muted); font-size: 12.5px; text-align: center; }
  #toTop {
    position: fixed; right: 22px; bottom: 22px; z-index: 40; width: 42px; height: 42px; border-radius: 50%;
    border: 0; background: var(--yellow); color: var(--navy); font-size: 20px; font-weight: 800;
    box-shadow: var(--shadow); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toTop.show { opacity: 1; pointer-events: auto; }
  .loading { padding: 60px; text-align: center; color: var(--muted); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; }
    #menuBtn { display: inline-flex; }
    nav.toc {
      position: fixed; left: 0; top: 56px; z-index: 60; width: 300px; background: var(--surface);
      transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow);
    }
    nav.toc.open { transform: none; }
    main { padding: 18px 14px 60px; }
    section.card { padding: 4px 18px 20px; }
    .hero { padding: 28px 22px; }
  }

  /* ---------- Print ---------- */
  @media print {
    .topbar, nav.toc, #toTop, .copy, .zoom { display: none !important; }
    .layout { display: block; }
    main { padding: 0; }
    body { background: #fff; font-size: 11pt; }
    section.card { box-shadow: none; border: 0; padding: 0; break-before: page; }
    section.card:first-of-type { break-before: auto; }
    figure.diagram, .table-wrap, pre, blockquote { break-inside: avoid; }
    .hero { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pill, .dir span, h2 .num { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    a { color: inherit; }
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/highlight.min.js"></script>
<script type="module">
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.esm.js';
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const slug = s => s.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');

/* ---------- Markdown -> HTML ---------- */
marked.use({
  gfm: true,
  renderer: {
    code({ text, lang }) {
      if (lang === 'mermaid') {
        return `<figure class="diagram"><span class="zoom">Click to enlarge ⤢</span><pre class="mermaid">${esc(text)}</pre></figure>`;
      }
      return false;
    }
  }
});
const content = $('#content');
content.innerHTML = marked.parse($('#md-source').textContent);

/* ---------- Hero from title, subtitle and meta table ---------- */
(function buildHero() {
  const h1 = $('h1', content);
  if (!h1) return;
  const hero = document.createElement('header');
  hero.className = 'hero';
  let html = `<div class="kicker">Alza Trade API · Supplier guide</div><h1>${h1.innerHTML}</h1>`;
  let el = h1.nextElementSibling;
  if (el && el.tagName === 'P') { html += `<p class="subtitle">${el.innerHTML}</p>`; const n = el.nextElementSibling; el.remove(); el = n; }
  if (el && el.tagName === 'TABLE') {
    html += '<div class="chips">' + $$('tbody tr', el).map(tr => {
      const [k, v] = tr.children;
      return `<div class="chip"><b>${k.textContent}</b>${v.innerHTML}</div>`;
    }).join('') + '</div>';
    el.remove();
  }
  html += `<div class="legend">Direction:
      <span class="dir"><span class="a">Alza</span>→<span class="s">Supplier</span></span>
      <span class="dir"><span class="s">Supplier</span>→<span class="a">Alza</span></span>
      &nbsp; Required: <span class="pill green">R</span> Conditional: <span class="pill amber">C</span> Not used: <span class="pill grey">–</span></div>`;
  hero.innerHTML = html;
  h1.replaceWith(hero);
})();

/* ---------- Drop the markdown "Contents" chapter (sidebar replaces it) ---------- */
$$('h2', content).forEach(h => {
  if (h.textContent.trim().toLowerCase() === 'contents') {
    let n = h.nextElementSibling;
    while (n && n.tagName !== 'H2') { const x = n.nextElementSibling; n.remove(); n = x; }
    h.remove();
  }
});

/* ---------- Heading ids (GitHub-style, keeps the .md links working) ---------- */
$$('h2, h3, h4', content).forEach(h => { h.id = slug(h.textContent); });
$$('h2', content).forEach(h => {
  const m = h.textContent.match(/^(\d+)\.\s+(.*)$/);
  if (m) h.innerHTML = `<span class="num">${m[1]}</span><span>${h.innerHTML.replace(/^\d+\.\s+/, '')}</span>`;
});

/* ---------- Group chapters into cards ---------- */
(function cards() {
  const kids = [...content.children];
  let card = null;
  for (const el of kids) {
    if (el.tagName === 'H2') { card = document.createElement('section'); card.className = 'card'; el.before(card); }
    if (card && el.tagName !== 'HR') card.appendChild(el);
    if (el.tagName === 'HR') el.remove();
  }
})();

/* ---------- Tables: wrapper, pills, direction badges ---------- */
const PILLS = { 'R': 'green', 'Required': 'green', 'Yes': 'green', 'C': 'amber', 'Yes/No': 'amber',
                '–': 'grey', '-': 'grey', 'No': 'grey', 'Not required': 'grey' };
$$('table', content).forEach(t => {
  const w = document.createElement('div'); w.className = 'table-wrap'; t.before(w); w.appendChild(t);
  $$('td', t).forEach(td => {
    const txt = td.textContent.trim();
    if (txt === 'A→S') td.innerHTML = '<span class="dir"><span class="a">Alza</span>→<span class="s">Supplier</span></span>';
    else if (txt === 'S→A') td.innerHTML = '<span class="dir"><span class="s">Supplier</span>→<span class="a">Alza</span></span>';
    else if (PILLS[txt]) td.innerHTML = `<span class="pill ${PILLS[txt]}">${txt}</span>`;
    else if (/^-?\d+$/.test(txt) && td.cellIndex === 0 && t.rows[0].cells[0].textContent.trim() === 'Code') {
      td.innerHTML = `<span class="pill ${txt === '0' ? 'green' : 'red'}">${txt}</span>`;
    }
  });
  // Columns holding only pills / direction badges -> narrow, so text columns get the space
  const head = t.tHead?.rows[0]; const body = [...(t.tBodies[0]?.rows || [])];
  if (head) [...head.cells].forEach((th, i) => {
    if (i === head.cells.length - 1 && head.cells.length > 2) return;
    if (body.length && body.every(r => r.cells[i]?.querySelector(':scope > .pill:only-child, :scope > .dir:only-child'))) {
      th.classList.add('tight'); body.forEach(r => r.cells[i].classList.add('tight'));
    }
  });
});

/* ---------- Callouts ---------- */
$$('blockquote', content).forEach(b => b.classList.add(/TODO/.test(b.textContent) ? 'todo' : 'note'));

/* ---------- Code blocks: highlight + copy ---------- */
$$('pre > code', content).forEach(code => {
  const pre = code.parentElement;
  const lang = (code.className.match(/language-(\w+)/) || [])[1];
  if (window.hljs && lang && hljs.getLanguage(lang)) hljs.highlightElement(code);
  const w = document.createElement('div'); w.className = 'code-wrap'; pre.before(w); w.appendChild(pre);
  w.insertAdjacentHTML('afterbegin', `<span class="lang">${lang || 'text'}</span><button class="copy">Copy</button>`);
  $('.copy', w).onclick = async e => {
    await navigator.clipboard.writeText(code.textContent);
    e.target.textContent = 'Copied ✓'; e.target.classList.add('done');
    setTimeout(() => { e.target.textContent = 'Copy'; e.target.classList.remove('done'); }, 1500);
  };
});

/* ---------- External links in new tab ---------- */
$$('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });

/* ---------- Sidebar TOC + scrollspy ---------- */
const tocList = $('#tocList');
$$('section.card').forEach(card => {
  const h2 = $('h2', card); if (!h2) return;
  const num = $('.num', h2)?.textContent || '';
  const title = num ? h2.lastElementChild.textContent : h2.textContent;
  const li = document.createElement('li');
  li.innerHTML = `<a href="#${h2.id}" data-id="${h2.id}"><span class="n">${num}</span><span>${title}</span></a>`;
  const subs = $$('h3', card);
  if (subs.length) {
    li.insertAdjacentHTML('beforeend', '<ol>' + subs.map(h => `<li><a href="#${h.id}" data-id="${h.id}">${h.textContent}</a></li>`).join('') + '</ol>');
  }
  tocList.appendChild(li);
});
const links = new Map($$('#tocList a').map(a => [a.dataset.id, a]));
const spyHeads = $$('h2[id], h3[id]', content).filter(h => links.has(h.id));
let spyActive = null;
function spy() {
  let cur = spyHeads[0];
  for (const h of spyHeads) { if (h.getBoundingClientRect().top < 120) cur = h; else break; }
  if (!cur || cur === spyActive) return;
  spyActive = cur;
  $$('#tocList a.active').forEach(x => x.classList.remove('active'));
  $$('#tocList li.open').forEach(x => x.classList.remove('open'));
  const a = links.get(cur.id); a.classList.add('active');
  const top = a.closest('#tocList > li'); top?.classList.add('open');
  top?.querySelector(':scope > a')?.classList.add('active');
  a.scrollIntoView({ block: 'nearest' });
}
addEventListener('scroll', spy, { passive: true });
spy();
$('#menuBtn').onclick = () => $('#toc').classList.toggle('open');
$$('#tocList a').forEach(a => a.addEventListener('click', () => $('#toc').classList.remove('open')));

/* ---------- Mermaid with theme-aware colours ---------- */
const FONT = getComputedStyle(document.documentElement).getPropertyValue('--font');
const MERMAID_THEMES = {
  light: {
    background: '#f1f4fa', fontFamily: FONT, fontSize: '14px',
    primaryColor: '#e8eeff', primaryTextColor: '#1b2340', primaryBorderColor: '#2f5bea',
    secondaryColor: '#fff3d0', tertiaryColor: '#ffffff', lineColor: '#5b6480', textColor: '#1b2340',
    mainBkg: '#e8eeff', nodeBorder: '#2f5bea', clusterBkg: '#ffffff', clusterBorder: '#c3cde6',
    edgeLabelBackground: '#ffffff', titleColor: '#0F1B42',
    actorBkg: '#0F1B42', actorBorder: '#0F1B42', actorTextColor: '#ffffff', actorLineColor: '#a7b0cc',
    signalColor: '#1b2340', signalTextColor: '#1b2340',
    labelBoxBkgColor: '#FFC800', labelBoxBorderColor: '#e0b000', labelTextColor: '#0F1B42', loopTextColor: '#1b2340',
    noteBkgColor: '#fff3d0', noteBorderColor: '#FFC800', noteTextColor: '#1b2340',
    activationBkgColor: '#fff3d0', activationBorderColor: '#FFC800', sequenceNumberColor: '#ffffff',
    attributeBackgroundColorOdd: '#ffffff', attributeBackgroundColorEven: '#f4f6fb'
  },
  dark: {
    darkMode: true, background: '#172042', fontFamily: FONT, fontSize: '14px',
    primaryColor: '#1d2c5e', primaryTextColor: '#e4e8f6', primaryBorderColor: '#7ea2ff',
    secondaryColor: '#3a2f0e', tertiaryColor: '#111833', lineColor: '#97a1c2', textColor: '#e4e8f6',
    mainBkg: '#1d2c5e', nodeBorder: '#7ea2ff', clusterBkg: '#111833', clusterBorder: '#33406e',
    edgeLabelBackground: '#172042', titleColor: '#ffffff',
    actorBkg: '#FFC800', actorBorder: '#FFC800', actorTextColor: '#0F1B42', actorLineColor: '#3d4a78',
    signalColor: '#e4e8f6', signalTextColor: '#e4e8f6',
    labelBoxBkgColor: '#FFC800', labelBoxBorderColor: '#FFC800', labelTextColor: '#0F1B42', loopTextColor: '#e4e8f6',
    noteBkgColor: '#3a2f0e', noteBorderColor: '#FFC800', noteTextColor: '#ffe9a3',
    activationBkgColor: '#3a2f0e', activationBorderColor: '#FFC800', sequenceNumberColor: '#0F1B42',
    attributeBackgroundColorOdd: '#172042', attributeBackgroundColorEven: '#111833'
  }
};
const diagrams = $$('pre.mermaid', content);
diagrams.forEach(d => { d.dataset.src = d.textContent; });

async function renderDiagrams(theme) {
  mermaid.initialize({
    startOnLoad: false, theme: 'base', themeVariables: MERMAID_THEMES[theme], securityLevel: 'loose',
    sequence: { mirrorActors: false, actorMargin: 70, messageMargin: 38, useMaxWidth: true },
    flowchart: { curve: 'basis', useMaxWidth: true }, er: { useMaxWidth: true }
  });
  diagrams.forEach(d => { d.removeAttribute('data-processed'); d.textContent = d.dataset.src; });
  await mermaid.run({ nodes: diagrams });
}

/* ---------- Theme switch ---------- */
function applyThemeUi(theme) {
  $('#themeLabel').textContent = theme === 'dark' ? 'Light' : 'Dark';
  $('#iconSun').style.display = theme === 'dark' ? '' : 'none';
  $('#iconMoon').style.display = theme === 'dark' ? 'none' : '';
}
async function setTheme(theme, persist = true) {
  document.documentElement.setAttribute('data-theme', theme);
  if (persist) localStorage.setItem('cookbook-theme', theme);
  applyThemeUi(theme);
  await renderDiagrams(theme);
}
const current = () => document.documentElement.getAttribute('data-theme');
$('#themeBtn').onclick = () => setTheme(current() === 'dark' ? 'light' : 'dark');
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  if (!localStorage.getItem('cookbook-theme')) setTheme(e.matches ? 'dark' : 'light', false);
});
applyThemeUi(current());
await renderDiagrams(current());

/* ---------- Print: always light ---------- */
$('#printBtn').onclick = async () => {
  const was = current();
  if (was === 'dark') await setTheme('light', false);
  window.print();
  if (was === 'dark') await setTheme('dark', false);
};

/* ---------- Diagram zoom ---------- */
const modal = $('#modal');
content.addEventListener('click', e => {
  const fig = e.target.closest('figure.diagram'); if (!fig) return;
  const svg = $('svg', fig); if (!svg) return;
  $('#modalInner').innerHTML = ''; $('#modalInner').appendChild(svg.cloneNode(true));
  modal.classList.add('open');
});
modal.onclick = () => modal.classList.remove('open');
document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });

/* ---------- Back to top ---------- */
const toTop = $('#toTop');
addEventListener('scroll', () => toTop.classList.toggle('show', scrollY > 700), { passive: true });
toTop.onclick = () => scrollTo({ top: 0 });

/* ---------- Deep link after render ---------- */
if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
</script>
</body>
</html>
